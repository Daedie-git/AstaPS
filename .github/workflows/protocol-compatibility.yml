name: Protocol compatibility

on:
  pull_request:
    paths:
      - "protocol/**"
      - "tools/protocol/**"
      - "gradle/protocol-generation.gradle"
      - "src/main/java/emu/grasscutter/net/packet/**"
      - "src/main/java/emu/grasscutter/server/packet/**"
      - ".github/workflows/protocol-compatibility.yml"
  push:
    paths:
      - "protocol/**"
      - "tools/protocol/**"
      - "gradle/protocol-generation.gradle"
      - "src/main/java/emu/grasscutter/net/packet/**"
      - "src/main/java/emu/grasscutter/server/packet/**"
      - ".github/workflows/protocol-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the descriptor reader
        run: python -m pip install -r tools/protocol/compatibility-requirements.txt
      - name: Test evidence qualification and audit regressions
        run: python -m unittest discover -s tools/protocol -p 'test_*compatibility*.py' -v
      - name: Generate the actual merged server descriptor
        run: bash gradlew generateProtocolJava --build-cache -Dorg.gradle.jvmargs=-Xmx4g
      - name: Audit declared packet contracts
        run: python tools/protocol/check_compatibility.py --output build/reports/protocol-compatibility.json
      - name: Upload the complete report, including review and unknown cases
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-compatibility-report
          path: build/reports/protocol-compatibility.json
          if-no-files-found: ignore
          retention-days: 14
